name: "Backfill - paid month burst"

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "Max API calls this run (use a small number to smoke-test)"
        required: false
        default: "15000"

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

env:
  DB_TAG: db

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$DB_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$DB_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern bracketboard.db --clobber
            echo "restored $(stat -c%s bracketboard.db) bytes"
          else
            echo "No database release yet - starting a new database."
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Run backfill
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
          PACE_SECONDS: "1.1"          # Standard tier pace (60/min)
          CALLS_PER_RUN: ${{ inputs.calls || '15000' }}
          MONTHLY_CEILING: "48000"     # Standard tier: 50k/month
          PYTHONUNBUFFERED: "1"        # stream the log live; don't block-buffer
        run: python backfill.py

      # This is the run most worth saving on cancellation: hours of paced,
      # paid-for calls are already committed to the file by the time anyone
      # stops it.
      - name: Save the database
        if: always() && steps.restore.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -s bracketboard.db ] || { echo "database missing or empty; refusing to upload"; exit 1; }
          gh release upload "$DB_TAG" bracketboard.db --repo "$GITHUB_REPOSITORY" --clobber
          echo "saved $(stat -c%s bracketboard.db) bytes"

      - name: Publish the dashboard
        if: always() && steps.restore.outputs.ready == '1'
        run: |
          git config user.name "bracket-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Backfill $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
