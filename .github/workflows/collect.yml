name: "Phase 2 - Collector and Alerts"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (best-effort)

permissions:
  contents: write

concurrency:
  group: sweep            # same group as the sweep = never run at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code and database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the collector
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CALLS_PER_RUN: "6"
        run: python collector.py

      - name: Save results back to the repository
        run: |
          git config user.name "bracket-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bracketboard.db
          git diff --cached --quiet || git commit -m "Collector update $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
