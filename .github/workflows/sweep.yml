name: "Phase 1 - Sweep and Bracket"

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "Max API calls this run (raise it to finish the crawl faster)"
        required: false
        default: "200"
  schedule:
    - cron: "17 0,6,12,18 * * *"   # four times a day (UTC)

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

env:
  DB_TAG: db                 # release asset holding bracketboard.db

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Newest .db asset wins. Saves upload under a unique name, so during
          # an upload the previous copy is still there and still newest until
          # the new one lands.
          NAME=$(gh release view "$DB_TAG" --repo "$GITHUB_REPOSITORY"             --json assets --jq '[.assets[]|select(.name|endswith(".db"))]
                                |sort_by(.createdAt)|last|.name' 2>/dev/null || true)
          if [ -n "$NAME" ] && [ "$NAME" != "null" ]; then
            # No "|| true": if an asset exists but will not download, stop.
            # Carrying on would build an empty database and save that over it.
            gh release download "$DB_TAG" --repo "$GITHUB_REPOSITORY"               --pattern "$NAME" --clobber
            [ "$NAME" = "bracketboard.db" ] || mv -f "$NAME" bracketboard.db
            echo "restored $NAME, $(stat -c%s bracketboard.db) bytes"
          else
            echo "No database asset yet - starting a new database."
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Run the sweep
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
          PACE_SECONDS: "1.1"          # Standard tier pace (60/min)
          CALLS_PER_RUN: ${{ inputs.calls || '200' }}
          MONTHLY_CEILING: "48000"     # shared pool cap; must match every workflow
          PYTHONUNBUFFERED: "1"
        run: python sweep.py

      # always(): a cancelled or timed-out run has still done real, paid-for
      # work that SQLite has already committed to the file. Save it rather
      # than throw it away, which is what the old git-commit step did.
      - name: Save the database
        if: always() && steps.restore.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -s bracketboard.db ] || { echo "database missing or empty; refusing to upload"; exit 1; }
          # Upload under a run-unique name and only then remove the previous
          # copies. --clobber deletes before it uploads, so a run cancelled
          # mid-upload destroys the only asset - which is exactly how the
          # database was lost once.
          NEW="bracketboard-${GITHUB_RUN_ID}.db"
          cp bracketboard.db "$NEW"
          gh release upload "$DB_TAG" "$NEW" --repo "$GITHUB_REPOSITORY"
          for OLD in $(gh release view "$DB_TAG" --repo "$GITHUB_REPOSITORY"               --json assets --jq '.assets[].name' | grep -v "^${NEW}$"); do
            gh release delete-asset "$DB_TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y || true
          done
          echo "saved $NEW, $(stat -c%s bracketboard.db) bytes"

      - name: Publish the dashboard
        if: always() && steps.restore.outputs.ready == '1'
        run: |
          git config user.name "bracket-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Sweep update $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
