name: "Step 0 - Connection Test"

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the connection tester
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
        run: python test_connection.py

      - name: Publish the report for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test_report.txt
            api_samples/
          if-no-files-found: warn
